{% extends "otree/Page.html" %}

{% block global_styles %}
<style>
  :root{
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  html, body{
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3{
    font-weight: 700;
  }

  p, li, td{
    font-weight: 400;
  }

  .pill, .tag{
    font-weight: 500 !important;
  }

  .kpi .val{
    font-weight: 700 !important;
  }

  .hero p{
    font-weight: 400 !important;
  }

  .otree-btn-next, button{
    font-weight: 600 !important;
  }

/* FORCE TYPOGRAPHY NORMALIZATION */

.hero p,
.info .text,
.note,
.smallnote,
.footer-note,
.confirm,
.muted,
.sub{
  font-weight: 400 !important;
}

.pill,
.tag,
.stat .k,
.summary .k{
  font-weight: 500 !important;
}

.cardx h3,
.box h3,
.info .title{
  font-weight: 600 !important;
}

.kpi .val,
.stat .v,
.summary .v{
  font-weight: 700 !important;
}

body{
  font-size:16px;
}

.kpi .val{
  letter-spacing:0.2px;
}


</style>



{% endblock %}
